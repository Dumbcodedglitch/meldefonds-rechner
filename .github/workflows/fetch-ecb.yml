# Downloads the European Central Bank's euro reference rates and saves the part the tracker needs in data/ecb-rates.csv.
# Made by the Austria Tax Tracker. You can also start it by hand: Actions tab > Fetch ECB rates > Run workflow.
name: Fetch ECB rates

"on":
  schedule:
    # Monday to Friday at 17:47 UTC. The ECB publishes its rates around 16:00 Central European Time. GitHub may start it some minutes late.
    - cron: '47 17 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write   # lets the save step store data/ecb-rates.csv in this repository (only that step gets the token)
  pages: write      # lets the job ask GitHub Pages to publish the new file (last step)

concurrency:
  group: fetch-ecb
  cancel-in-progress: false

jobs:
  ecb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # the token is not stored for the steps that read the answers from the internet; only the save step below gets it
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Fetch the ECB rates
        run: node scripts/fetch-ecb.js data/ecb-rates.csv

      - name: Save the rates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ecb-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -f data/ecb-rates.csv ]; then git add data/ecb-rates.csv; fi
          # hooksPath: no script left in the folder by an earlier step runs while the token is in use
          git -c core.hooksPath=/dev/null diff --quiet --cached || git -c core.hooksPath=/dev/null commit -m "Update ECB rates ($(date -u +%Y-%m-%d))"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -c core.hooksPath=/dev/null pull --rebase "$remote" "$GITHUB_REF_NAME"
          git -c core.hooksPath=/dev/null push "$remote" "HEAD:$GITHUB_REF_NAME"

      - name: Ask GitHub Pages to publish the new file
        # GitHub does not publish a Pages site again after a push made by a job with its built-in token, so the copy of
        # data/ecb-rates.csv on the site would stay old. This step asks for it. The tracker reads the newest copy straight from
        # the repository, so it does not depend on this step; the step keeps the copy on the site up to date as well.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds" --silent || echo "Pages could not be asked to publish. This step is only a safety net."
